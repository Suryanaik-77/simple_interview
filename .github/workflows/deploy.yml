name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/key.pem
          chmod 600 /tmp/key.pem

          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            cd /home/ubuntu/simple_interview
            git pull origin main

            # Install any new dependencies
            /home/ubuntu/venv311/bin/pip install -r requirements.txt -q 2>/dev/null || true

            # Restart the app — wait for port 8001 to be released before starting
            pkill -f "python main.py" || true
            for i in $(seq 1 10); do
              ss -tlnp | grep -q ':8001' || break
              echo "Waiting for port 8001 to free... ($i/10)"
              sleep 1
            done
            nohup /home/ubuntu/venv311/bin/python main.py > app.log 2>&1 &

            # Wait and verify — check the port, not just the process name
            for i in $(seq 1 12); do
              sleep 1
              ss -tlnp | grep -q ':8001' && echo "App restarted successfully (${i}s)" && break
              if [ $i -eq 12 ]; then
                echo "App failed to start!"
                tail -20 app.log
                exit 1
              fi
            done

            # Restart the standalone RAG app (systemd unit rag.service, :8100).
            # It rebuilds its vector index on startup when the lab HTML changed.
            /home/ubuntu/venv311/bin/pip install -r rag_interview/requirements.txt -q 2>/dev/null || true
            sudo systemctl restart rag.service

            # Give the index rebuild time, then verify it is serving.
            sleep 10
            if curl -sf -m 8 http://127.0.0.1:8100/health > /dev/null; then
              echo "RAG app restarted successfully"
            else
              echo "RAG app failed to start!"
              sudo journalctl -u rag.service -n 30 --no-pager || true
              exit 1
            fi

            # Restart the realtime voice-test app (systemd unit rt-app, :8110/8111,
            # proxied by nginx at /realtime/). Non-fatal: don't fail the deploy.
            sudo systemctl restart rt-app.service || true
            sleep 6
            if curl -sf -m 8 http://127.0.0.1:8110/ > /dev/null; then
              echo "Realtime app restarted successfully"
            else
              echo "WARN: realtime app not responding"
              sudo journalctl -u rt-app.service -n 20 --no-pager || true
            fi
          ENDSSH

          rm -f /tmp/key.pem
