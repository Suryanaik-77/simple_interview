name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/key.pem
          chmod 600 /tmp/key.pem

          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            cd /home/ubuntu/simple_interview
            git pull origin main

            # Install any new dependencies
            /home/ubuntu/venv311/bin/pip install -r requirements.txt -q 2>/dev/null || true

            # Restart the app
            pkill -f "python main.py" || true
            sleep 2
            nohup /home/ubuntu/venv311/bin/python main.py > app.log 2>&1 &

            # Wait and verify
            sleep 5
            if pgrep -f "python main.py" > /dev/null; then
              echo "App restarted successfully"
            else
              echo "App failed to start!"
              tail -20 app.log
              exit 1
            fi

            # Restart the standalone RAG app (separate process on :8100).
            # It rebuilds its vector index on startup when the lab HTML changed.
            /home/ubuntu/venv311/bin/pip install -r rag_interview/requirements.txt -q 2>/dev/null || true
            pkill -f "uvicorn app:app" || true
            sleep 2
            cd rag_interview
            nohup /home/ubuntu/venv311/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8100 > rag.log 2>&1 &

            # Give the index rebuild time, then verify the process is alive.
            sleep 10
            if pgrep -f "uvicorn app:app" > /dev/null; then
              echo "RAG app restarted successfully"
            else
              echo "RAG app failed to start!"
              tail -30 rag.log
              exit 1
            fi
          ENDSSH

          rm -f /tmp/key.pem
