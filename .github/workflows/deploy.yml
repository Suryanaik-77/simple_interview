name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/key.pem
          chmod 600 /tmp/key.pem

          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            cd /home/ubuntu/simple_interview
            git pull origin main

            # Install any new dependencies
            /home/ubuntu/venv311/bin/pip install -r requirements.txt -q 2>/dev/null || true

            # Restart the app — wait for port 8001 to be released before starting
            pkill -f "python main.py" || true
            for i in $(seq 1 10); do
              ss -tlnp | grep -q ':8001' || break
              echo "Waiting for port 8001 to free... ($i/10)"
              sleep 1
            done
            nohup /home/ubuntu/venv311/bin/python main.py > app.log 2>&1 &

            # Wait and verify — check the port, not just the process name
            for i in $(seq 1 12); do
              sleep 1
              ss -tlnp | grep -q ':8001' && echo "App restarted successfully (${i}s)" && break
              if [ $i -eq 12 ]; then
                echo "App failed to start!"
                tail -20 app.log
                exit 1
              fi
            done

            # NOTE: The RAG (:8100) and realtime (rt-app, :8110) apps are managed
            # MANUALLY — the deploy no longer restarts them. Start/stop them yourself
            # when their code or the lab HTML changes (RAG rebuilds its vector index
            # on startup). This keeps deploys from bouncing services you run by hand.
          ENDSSH

          rm -f /tmp/key.pem
