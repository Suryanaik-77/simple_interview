name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/key.pem
          chmod 600 /tmp/key.pem

          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            cd /home/ubuntu/simple_interview
            git pull origin main

            # Ensure systemd service is stopped and disabled (manual mode)
            sudo systemctl stop interview.service 2>/dev/null || true
            sudo systemctl disable interview.service 2>/dev/null || true

            # Install any new dependencies
            source /home/ubuntu/venv311/bin/activate
            pip install -r requirements.txt -q 2>/dev/null || true

            # Restart the app — kill existing process and wait for port release
            pkill -f "python3 main.py" || pkill -f "python main.py" || true
            for i in $(seq 1 10); do
              ss -tlnp | grep -q ':8001' || break
              echo "Waiting for port 8001 to free... ($i/10)"
              sleep 1
            done

            # Start manually with nohup (no systemd)
            nohup /home/ubuntu/venv311/bin/python3 main.py > /home/ubuntu/simple_interview/app.log 2>&1 &

            # Wait and verify app started
            for i in $(seq 1 12); do
              sleep 1
              if ss -tlnp | grep -q ':8001'; then
                echo "✓ App restarted successfully (${i}s)"
                echo "✓ Logs: tail -f /home/ubuntu/simple_interview/app.log"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "✗ App failed to start!"
                echo "Last 30 lines of log:"
                tail -30 /home/ubuntu/simple_interview/app.log
                exit 1
              fi
            done

            # NOTE: The RAG (:8100) and realtime (rt-app, :8110) apps are managed
            # MANUALLY — the deploy no longer restarts them. Start/stop them yourself
            # when their code or the lab HTML changes (RAG rebuilds its vector index
            # on startup). This keeps deploys from bouncing services you run by hand.
          ENDSSH

          rm -f /tmp/key.pem
