<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab RAG</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --line: #262b38; --text: #e6e9ef;
      --muted: #8b93a7; --accent: #6d8bff; --accent-soft: #1e2740;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
    header .meta { color: var(--muted); font-size: 12px; }
    select {
      margin-left: auto; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px;
    }
    #chat { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { max-width: 820px; margin: 0 auto 18px; }
    .role { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
    .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; line-height: 1.6; white-space: pre-wrap; }
    .msg.user .bubble { background: var(--accent-soft); border-color: #2c3860; }
    .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    details.src { background: #12151d; border: 1px solid var(--line); border-radius: 8px; }
    details.src summary { cursor: pointer; padding: 8px 12px; font-size: 12.5px; color: var(--muted); list-style: none; }
    details.src summary::-webkit-details-marker { display: none; }
    details.src[open] summary { color: var(--text); border-bottom: 1px solid var(--line); }
    details.src .body { padding: 10px 12px; font-size: 12.5px; color: #c4cad8; white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
    .badge { color: var(--accent); font-variant-numeric: tabular-nums; }
    footer { border-top: 1px solid var(--line); padding: 14px 20px; }
    .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
    textarea {
      flex: 1; resize: none; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px;
      font-family: inherit; min-height: 46px; max-height: 160px;
    }
    button {
      background: var(--accent); color: #0b0e16; border: none; border-radius: 10px;
      padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .hint { max-width: 820px; margin: 40px auto; text-align: center; color: var(--muted); }
    .hint code { background: var(--panel); padding: 2px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>Lab RAG</h1>
    <span class="meta" id="meta"></span>
    <select id="lab">
      <option value="">All labs</option>
      {% for lab in labs %}<option value="{{ lab }}">{{ lab }}</option>{% endfor %}
    </select>
  </header>

  <div id="chat">
    <div class="hint" id="hint">
      Ask a question about the lab testcases.<br />
      e.g. <code>How do I load the SRAM macro libraries in Formality?</code>
    </div>
  </div>

  <footer>
    <div class="composer">
      <textarea id="q" placeholder="Ask about the labs…" rows="1"></textarea>
      <button id="send">Ask</button>
    </div>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const q = document.getElementById("q");
    const send = document.getElementById("send");
    const labSel = document.getElementById("lab");
    const hint = document.getElementById("hint");

    fetch("/api/labs").then(r => r.json()).then(d => {
      document.getElementById("meta").textContent =
        `${d.chunks} sections · ${d.labs.length} labs`;
    });

    function esc(s) {
      return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    function addMsg(role, html) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = `<div class="role">${role}</div><div class="bubble">${html}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function ask() {
      const question = q.value.trim();
      if (!question) return;
      hint && hint.remove();
      q.value = "";
      q.style.height = "auto";
      addMsg("user", esc(question));
      send.disabled = true;

      const thinking = addMsg("assistant", "…");
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, lab_name: labSel.value || null, k: 5 }),
        });
        const data = await res.json();
        let html = esc(data.answer || "(no answer)");
        if (data.sources && data.sources.length) {
          html += '<div class="sources">';
          for (const s of data.sources) {
            html += `<details class="src"><summary>`
              + `<span class="badge">[${s.n}]</span> ${esc(s.lab_name)} — ${esc(s.heading)} `
              + `· ${esc(s.source)} · sim ${s.score}</summary>`
              + `<div class="body">${esc(s.content)}</div></details>`;
          }
          html += "</div>";
        }
        thinking.querySelector(".bubble").innerHTML = html;
      } catch (e) {
        thinking.querySelector(".bubble").textContent = "Error: " + e;
      } finally {
        send.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }

    send.addEventListener("click", ask);
    q.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
    });
    q.addEventListener("input", () => {
      q.style.height = "auto";
      q.style.height = Math.min(q.scrollHeight, 160) + "px";
    });
  </script>
</body>
</html>
