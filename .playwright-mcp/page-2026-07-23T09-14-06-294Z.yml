      - heading "What is Analog Layout?" [level=2] [ref=e39]
      - generic [ref=e40]:
        - paragraph [ref=e41]: As a VLSI Analog Layout Engineer, you implement physical designs for analog/mixed-signal circuits on silicon chips. This involves translating schematics to layouts while optimizing for performance and area.
        - paragraph [ref=e42]: You precisely place and route transistors, capacitors, and resistors according to foundry-specific design rules. Key tasks include maintaining device matching, minimizing parasitics, and implementing noise-reduction techniques.
        - paragraph [ref=e43]: Design key analog blocks like amplifiers, comparators, and bias circuits with proper symmetry and shielding. This position bridges circuit design and fabrication, demanding technical precision and tool mastery.
